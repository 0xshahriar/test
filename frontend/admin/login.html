<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Tinkling Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Tinkling Tales</a>
      <div class="d-flex gap-2">
        <a href="../login.html" class="btn btn-outline-secondary btn-sm">Customer Login</a>
        <a href="signup.html" class="btn btn-primary btn-sm">Admin Request</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h1 class="h4 fw-bold mb-3 text-center">Admin Console</h1>
              <form id="adminLoginForm" class="row g-3">
                <div class="col-12">
                  <label for="adminLoginEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="adminLoginEmail" required>
                </div>
                <div class="col-12">
                  <label for="adminLoginPassword" class="form-label">Password</label>
                  <input type="password" class="form-control" id="adminLoginPassword" required>
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary">Login</button>
                </div>
              </form>
              <div id="adminLoginFeedback" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer mt-auto">
    <div class="container text-center">
      <p class="mb-0">&copy; <span id="year"></span> Tinkling Tales.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin-login.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
