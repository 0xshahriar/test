<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Tinkling Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#5a189a;">
    <div class="container">
      <a class="navbar-brand text-uppercase" href="../index.html">Tinkling Tales Admin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-controls="adminNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#" id="logoutAdmin">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="dashboard-card p-4 rounded-4">
          <h6 class="text-uppercase text-muted">Products</h6>
          <div class="fs-3 fw-bold" id="statProducts">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="dashboard-card p-4 rounded-4">
          <h6 class="text-uppercase text-muted">Orders</h6>
          <div class="fs-3 fw-bold" id="statOrders">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="dashboard-card p-4 rounded-4">
          <h6 class="text-uppercase text-muted">New Contacts</h6>
          <div class="fs-3 fw-bold" id="statContacts">0</div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="fw-bold">Products</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" data-action="create">Add Product</button>
    </div>
    <div class="card border-0 shadow-sm mb-5">
      <div class="table-responsive">
        <table class="table align-middle mb-0" id="productsTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Price</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <h2 class="fw-bold mb-3">Orders</h2>
    <div class="card border-0 shadow-sm mb-5">
      <div class="table-responsive">
        <table class="table align-middle mb-0" id="ordersTable">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Total</th>
              <th>Status</th>
              <th>Payment</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <h2 class="fw-bold mb-3">Contact Requests</h2>
    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table align-middle mb-0" id="contactsTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Subject</th>
              <th>Received</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="productForm">
          <div class="modal-header">
            <h5 class="modal-title" id="productModalLabel">Add Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="productId">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="productTitle" class="form-label">Title</label>
                <input type="text" class="form-control" id="productTitle" required>
              </div>
              <div class="col-md-6">
                <label for="productCategory" class="form-label">Category</label>
                <input type="text" class="form-control" id="productCategory" required>
              </div>
              <div class="col-md-6">
                <label for="productPrice" class="form-label">Price</label>
                <input type="number" step="0.01" class="form-control" id="productPrice" required>
              </div>
              <div class="col-md-6">
                <label for="productInventory" class="form-label">Inventory</label>
                <input type="number" class="form-control" id="productInventory" required>
              </div>
              <div class="col-12">
                <label for="productImage" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="productImage">
              </div>
              <div class="col-12">
                <label for="productTags" class="form-label">Tags (comma separated)</label>
                <input type="text" class="form-control" id="productTags">
              </div>
              <div class="col-12">
                <label for="productDescription" class="form-label">Description</label>
                <textarea class="form-control" id="productDescription" rows="4" required></textarea>
              </div>
              <div class="col-12">
                <label for="productStatus" class="form-label">Status</label>
                <select class="form-select" id="productStatus">
                  <option value="active">Active</option>
                  <option value="draft">Draft</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
