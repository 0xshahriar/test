<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Tinkling Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">Tinkling Tales</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="products.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link position-relative" href="cart.html">Cart <span class="badge bg-primary rounded-pill ms-1 d-none" data-cart-count></span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h1 class="h4 fw-bold mb-3 text-center">Reset your password</h1>
              <form id="requestResetForm" class="row g-3">
                <div class="col-12">
                  <label for="resetEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="resetEmail" required>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary w-100">Send reset code</button>
                </div>
              </form>
              <div id="resetRequestFeedback" class="mt-3"></div>

              <hr class="my-4">

              <form id="confirmResetForm" class="row g-3">
                <div class="col-12">
                  <label for="resetCode" class="form-label">Reset Code</label>
                  <input type="text" class="form-control" id="resetCode" required>
                </div>
                <div class="col-12">
                  <label for="newPassword" class="form-label">New Password</label>
                  <input type="password" class="form-control" id="newPassword" minlength="8" required>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-success w-100">Update password</button>
                </div>
              </form>
              <div id="resetConfirmFeedback" class="mt-3"></div>
              <p class="mt-4 text-center text-muted"><a href="login.html">Return to login</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer mt-auto">
    <div class="container text-center">
      <p class="mb-0">&copy; <span id="year"></span> Tinkling Tales.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/forgot-password.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
