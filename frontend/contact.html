<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Tinkling Tales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">Tinkling Tales</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="products.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link position-relative" href="cart.html">Cart <span class="badge bg-primary rounded-pill ms-1 d-none" data-cart-count></span></a></li>
          <li class="nav-item" data-auth-link="signup"><a class="nav-link" href="signup.html">Join</a></li>
          <li class="nav-item" data-auth-link="login"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item d-none" data-auth-link="dashboard"><a class="nav-link" href="admin/dashboard.html">Admin</a></li>
          <li class="nav-item d-none" data-auth-link="logout"><a class="nav-link" href="#">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row g-5">
        <div class="col-lg-6">
          <h1 class="fw-bold">Let’s craft magic together</h1>
          <p class="text-muted">Share your ideas, partnership proposals, or support requests. We’ll reply within two working days.</p>
          <div class="d-flex align-items-center gap-3 mt-4">
            <i class="bi bi-envelope-heart fs-2 text-primary"></i>
            <div>
              <div class="fw-semibold">hello@tinklingtales.com</div>
              <div class="text-muted">We love thoughtful notes.</div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title">Send a Message</h5>
              <form id="contactForm" class="row g-3">
                <div class="col-md-6">
                  <label for="contactName" class="form-label">Name</label>
                  <input type="text" class="form-control" id="contactName" required>
                </div>
                <div class="col-md-6">
                  <label for="contactEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="contactEmail" required>
                </div>
                <div class="col-12">
                  <label for="contactSubject" class="form-label">Subject</label>
                  <input type="text" class="form-control" id="contactSubject" required>
                </div>
                <div class="col-12">
                  <label for="contactMessage" class="form-label">Message</label>
                  <textarea class="form-control" id="contactMessage" rows="4" required></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary">Send</button>
                </div>
              </form>
              <div id="contactFeedback" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container text-center">
      <p class="mb-0">&copy; <span id="year"></span> Tinkling Tales.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/contact.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
